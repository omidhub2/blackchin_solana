name: Deposit verification and scanner regression tests

on:
  push:
    branches:
      - "fix/withdrawal-deposit-safety"
  pull_request:
    branches:
      - main

jobs:
  deposit-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run deposit scanner tests
        run: node --test test/deposit-scanner.service.test.js test/deposit-scanner-worker.test.js test/deposit-scanner-wallet-resolution.test.js test/deposit.service.test.js test/deposit-reconciliation.service.test.js test/withdrawal-reconciliation.service.test.js test/hd-transactions.test.js test/migrations.test.js && npm run check:imports
