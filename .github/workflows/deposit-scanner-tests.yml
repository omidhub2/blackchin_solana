name: CI

on:
  push:
    branches:
      - "fix/withdrawal-deposit-safety"
      - "feat/tenant-withdrawal-policy-management"
      - "hardening/phase1-ci-test-foundation"
      - "security/phase2-signed-tenant-rls"
      - "security/phase3-ledger-atomicity"
      - "security/phase4-worker-reconciliation"
      - "reliability/phase5-end-to-end"
      - "observability/phase6-production-readiness"
      - "feature/phase6-sweeper-engine"
      - "integration/all-phases-sweeper-observability"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node 20 + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: blackchin_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blackchin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blackchin_ci
      TENANT_DATABASE_URL: postgresql://blackchin_ci_tenant:ci-tenant-password@127.0.0.1:5432/blackchin_ci
      DEPOSIT_WORKER_DATABASE_URL: postgresql://blackchin_ci_deposit_worker:ci-worker-password@127.0.0.1:5432/blackchin_ci
      SWEEPER_DATABASE_URL: postgresql://blackchin_ci_sweeper:ci-sweeper-password@127.0.0.1:5432/blackchin_ci
      TENANT_CONTEXT_HMAC_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      API_ACCESS_KEY: ci-only-api-key-aaaaaaaaaaaaaaaaaaaaaaaa
      SOLANA_NETWORK: devnet
      SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_COMMITMENT: confirmed
      DASHBOARD_COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Verify migration plan
        run: npm run db:migrate:status

      - name: Apply migrations to disposable CI database
        run: npm run db:migrate

      - name: Provision restricted tenant runtime login
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          await pool.query(`
            DO $block$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'blackchin_ci_tenant') THEN
                CREATE ROLE blackchin_ci_tenant LOGIN PASSWORD 'ci-tenant-password'
                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
              END IF;
            END
            $block$;
          `);
          await pool.query('GRANT blackchin_tenant_runtime TO blackchin_ci_tenant');
          await pool.end();
          NODE

      - name: Provision restricted deposit worker runtime login
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          import { assertDepositWorkerRuntimeRole } from './src/infrastructure/security/deposit-worker-role.js';
          const admin = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          await admin.query(`
            DO $block$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'blackchin_ci_deposit_worker') THEN
                CREATE ROLE blackchin_ci_deposit_worker LOGIN
                  PASSWORD 'ci-worker-password' NOSUPERUSER NOCREATEDB NOCREATEROLE
                  INHERIT BYPASSRLS;
              END IF;
            END
            $block$;
          `);
          await admin.query('GRANT blackchin_deposit_worker_runtime TO blackchin_ci_deposit_worker');
          await admin.end();

          const worker = new pg.Pool({ connectionString: process.env.DEPOSIT_WORKER_DATABASE_URL });
          const identity = await assertDepositWorkerRuntimeRole(worker);
          assert.equal(identity.encryptedMnemonicAccess, false);
          await worker.query('SELECT public_key FROM wallets LIMIT 0');
          await assert.rejects(
            () => worker.query('SELECT mnemonic_encrypted FROM hd_wallets LIMIT 0'),
            (error) => error.code === '42501'
          );
          await assert.rejects(
            () => worker.query('SELECT * FROM tenants LIMIT 0'),
            (error) => error.code === '42501'
          );
          await worker.end();
          NODE

      - name: Provision restricted sweeper runtime login
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          import { assertSweeperRuntimeRole } from './src/infrastructure/security/sweeper-worker-role.js';
          const admin = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          await admin.query(`
            DO $block$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'blackchin_ci_sweeper') THEN
                CREATE ROLE blackchin_ci_sweeper LOGIN
                  PASSWORD 'ci-sweeper-password' NOSUPERUSER NOCREATEDB NOCREATEROLE
                  INHERIT BYPASSRLS;
              END IF;
            END
            $block$;
          `);
          await admin.query('GRANT blackchin_sweeper_runtime TO blackchin_ci_sweeper');
          await admin.end();

          const sweeper = new pg.Pool({ connectionString: process.env.SWEEPER_DATABASE_URL });
          const identity = await assertSweeperRuntimeRole(sweeper);
          assert.equal(identity.encryptedHdMnemonicAccess, true);
          assert.equal(identity.legacyPrivateKeyAccess, false);
          await sweeper.query('SELECT mnemonic_encrypted FROM hd_wallets LIMIT 0');
          await assert.rejects(
            () => sweeper.query('SELECT private_key_encrypted FROM wallets LIMIT 0'),
            (error) => error.code === '42501'
          );
          await assert.rejects(
            () => sweeper.query('SELECT * FROM tenant_api_credentials LIMIT 0'),
            (error) => error.code === '42501'
          );
          await sweeper.end();
          NODE

      - name: Run the complete backend test suite
        run: npm test

      - name: Check backend imports
        run: npm run check:imports

  dashboard-web:
    name: Dashboard typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/wallet-web/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/wallet-web
        run: npm ci

      - name: Type check dashboard
        working-directory: apps/wallet-web
        run: npm run typecheck

      - name: Build dashboard
        working-directory: apps/wallet-web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BLACKCHIN_API_URL: "http://127.0.0.1:3000"
        run: npm run build
