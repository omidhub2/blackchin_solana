name: Deposit verification and scanner regression tests

on:
  push:
    branches:
      - "fix/withdrawal-deposit-safety"
  pull_request:
    branches:
      - main

jobs:
  deposit-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run deposit scanner tests
        run: node --test test/ledger-immutability.test.js test/deposit-scanner.service.test.js test/deposit-scanner-worker.test.js test/deposit-scanner-wallet-resolution.test.js test/deposit.service.test.js test/deposit-reconciliation.service.test.js test/tenant-deposit-isolation.test.js test/tenant-wallet.api.test.js test/tenant-withdrawal.api.test.js test/tenant-withdrawal.service.test.js test/withdrawal-reconciliation.service.test.js test/hd-transactions.test.js test/migrations.test.js && node --check test/ledger-immutability.test.js && node --check src/index.js && node --check src/core/deposits/deposit.service.js && node --check src/core/deposits/deposit-scanner.service.js && node --check src/core/deposits/deposit-scanner-wallets.js && node --check src/core/deposits/deposit-reconciliation.service.js && node --check src/infrastructure/database/blockchain-transaction.repository.js && node --check src/infrastructure/database/tenant-wallet.repository.js && node --check src/infrastructure/database/wallet-account.repository.js && node --check src/infrastructure/database/deposit-reconciliation.repository.js && node --check src/api/routes/tenant-wallet.routes.js && node --check src/core/services.js && node --check src/core/health.service.js && node --check src/core/withdrawals/withdrawal.service.js && node --check src/core/withdrawals/tenant-withdrawal.service.js && node --check src/core/withdrawals/withdrawal-reconciliation.service.js && node --check src/infrastructure/database/withdrawal-reconciliation.repository.js && DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/blackchin_ci npm run check:imports
