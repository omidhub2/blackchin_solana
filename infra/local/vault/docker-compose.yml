# LOCAL DEVELOPMENT ONLY. Vault dev mode is in-memory, uses a root token,
# disables durable storage and is NOT suitable for production or real funds.
services:
  vault:
    image: hashicorp/vault:1.20
    container_name: blackchin-vault-dev
    command: ["server", "-dev", "-dev-root-token-id=blackchin-local-dev-root-token"]
    environment:
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
